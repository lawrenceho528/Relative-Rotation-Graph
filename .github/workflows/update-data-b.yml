name: Update RRG data (Batch B)

on:
  schedule:
    - cron: "35 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  batch-b:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify matching Batch A state (fail closed, no requests)
        run: python scripts/update_rrg_data.py --require-batch-a
      - name: Batch B - update remaining symbols and finalize
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/update_rrg_data.py --provider tiingo --batch B --batch-size 48 --finalize --require-batch-a --write-phase B
      - name: Validate complete real-data universe
        run: python scripts/update_rrg_data.py --validate-only
      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update generated RRG data
          file_pattern: public/data/*.json
      - name: Prepare static artifact
        shell: pwsh
        run: ./scripts/prepare-dist.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
