name: Update RRG data

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 150
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Batch A - update first 48 symbols (no deployment)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/update_rrg_data.py --provider tiingo --batch A --batch-size 48
      - name: Commit Batch A intermediate data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update generated RRG data (batch A)
          file_pattern: public/data/rrg.json
      - name: Wait for the next Tiingo hourly request window
        run: sleep 3660
      - name: Batch B - update remaining symbols and finalize
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/update_rrg_data.py --provider tiingo --batch B --batch-size 48 --finalize
      - name: Validate complete real-data universe
        run: python scripts/update_rrg_data.py --validate-only
      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update generated RRG data
          file_pattern: public/data/rrg.json
      - name: Prepare static artifact
        shell: pwsh
        run: ./scripts/prepare-dist.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  coverage-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    timeout-minutes: 100
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prove Tiingo ETF coverage without publishing
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/tiingo-coverage-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiingo-coverage-proof
          path: |
            tiingo-proof.json
            tiingo-prices.json
          if-no-files-found: ignore
          retention-days: 7
